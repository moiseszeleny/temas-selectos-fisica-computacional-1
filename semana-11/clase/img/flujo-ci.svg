<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Flujo de integracion continua: haces git push; GitHub Actions prepara una maquina nueva, descarga el repositorio, instala Python y las dependencias y corre pytest; si pytest termina con codigo 0 el Pull Request muestra un check verde, si no, una cruz roja">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fa8"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="758" height="298" rx="12" fill="#f7f7f5" stroke="#d8d8d3" stroke-width="1"/>

  <!-- 1. tu laptop -->
  <rect x="20" y="96" width="150" height="80" rx="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="95" y="124" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">tu laptop</text>
  <text x="95" y="150" font-family="monospace" font-size="13" fill="#333333" text-anchor="middle">git push</text>

  <path d="M 172 136 L 220 136" fill="none" stroke="#1f5fa8" stroke-width="1.5" marker-end="url(#flecha)"/>

  <!-- 2. la maquina de GitHub -->
  <rect x="224" y="30" width="300" height="212" rx="10" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="1.5"/>
  <text x="374" y="54" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f5fa8" text-anchor="middle">GitHub Actions: una máquina nueva</text>
  <text x="374" y="72" font-family="sans-serif" font-size="11" fill="#666666" text-anchor="middle">corre los pasos de .github/workflows/pruebas.yml</text>

  <rect x="244" y="86" width="260" height="30" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <text x="256" y="106" font-family="sans-serif" font-size="12" fill="#333333">1. descarga tu repositorio</text>
  <rect x="244" y="122" width="260" height="30" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <text x="256" y="142" font-family="sans-serif" font-size="12" fill="#333333">2. instala Python 3.11</text>
  <rect x="244" y="158" width="260" height="30" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <text x="252" y="178" font-family="monospace" font-size="11" fill="#333333">3. pip install -r requirements.txt</text>
  <rect x="244" y="194" width="260" height="30" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <text x="252" y="214" font-family="monospace" font-size="11" fill="#333333">4. python -m pytest tests</text>

  <!-- 3. el resultado -->
  <path d="M 526 120 L 590 84" fill="none" stroke="#1f5fa8" stroke-width="1.5" marker-end="url(#flecha)"/>
  <path d="M 526 152 L 590 188" fill="none" stroke="#1f5fa8" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="560" y="128" font-family="sans-serif" font-size="11" fill="#666666">código de salida</text>
  <text x="560" y="142" font-family="sans-serif" font-size="11" fill="#666666">de pytest</text>

  <rect x="594" y="50" width="146" height="64" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="667" y="78" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">0: todo pasó</text>
  <text x="667" y="98" font-family="sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle">check verde en el PR</text>

  <rect x="594" y="158" width="146" height="64" rx="10" fill="#ffffff" stroke="#c62828" stroke-width="1.5"/>
  <text x="667" y="186" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c62828" text-anchor="middle">otro: algo falló</text>
  <text x="667" y="206" font-family="sans-serif" font-size="12" fill="#c62828" text-anchor="middle">cruz roja en el PR</text>

  <text x="380" y="278" font-family="sans-serif" font-size="12" fill="#666666" text-anchor="middle">Nadie corre nada a mano: pasa en cada push y en cada Pull Request.</text>
</svg>
