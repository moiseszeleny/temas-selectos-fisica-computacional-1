<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Estructura de un paquete: la carpeta clase contiene el paquete osciladores, con __init__.py, amortiguado.py y energia.py, la carpeta tests con test_osciladores.py y el notebook. El notebook y las pruebas hacen import osciladores, que ejecuta __init__.py; __init__.py trae las funciones de amortiguado.py">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fa8"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="758" height="328" rx="12" fill="#f7f7f5" stroke="#d8d8d3" stroke-width="1"/>

  <!-- la carpeta de la clase -->
  <rect x="20" y="20" width="330" height="290" rx="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="36" y="46" font-family="monospace" font-size="14" font-weight="bold" fill="#333333">clase/</text>
  <line x1="36" y1="56" x2="334" y2="56" stroke="#d8d8d3" stroke-width="1"/>

  <!-- el paquete -->
  <rect x="40" y="68" width="290" height="118" rx="8" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="1.5"/>
  <text x="54" y="90" font-family="monospace" font-size="13" font-weight="bold" fill="#1f5fa8">osciladores/</text>
  <text x="316" y="90" font-family="sans-serif" font-size="11" fill="#1f5fa8" text-anchor="end">el paquete</text>
  <text x="70" y="116" font-family="monospace" font-size="13" fill="#333333">__init__.py</text>
  <text x="316" y="116" font-family="sans-serif" font-size="11" fill="#666666" text-anchor="end">lo convierte en paquete</text>
  <text x="70" y="142" font-family="monospace" font-size="13" fill="#333333">amortiguado.py</text>
  <text x="316" y="142" font-family="sans-serif" font-size="11" fill="#666666" text-anchor="end">ecuación y solución</text>
  <text x="70" y="168" font-family="monospace" font-size="13" fill="#333333">energia.py</text>
  <text x="316" y="168" font-family="sans-serif" font-size="11" fill="#666666" text-anchor="end">energía mecánica</text>

  <!-- las pruebas -->
  <text x="54" y="216" font-family="monospace" font-size="13" font-weight="bold" fill="#333333">tests/</text>
  <text x="66" y="240" font-family="monospace" font-size="13" fill="#333333">test_osciladores.py</text>
  <text x="316" y="240" font-family="sans-serif" font-size="11" fill="#666666" text-anchor="end">las pruebas</text>

  <!-- el notebook -->
  <text x="54" y="282" font-family="monospace" font-size="13" fill="#333333">semana-11-sesion-1-....ipynb</text>

  <!-- quien importa -->
  <rect x="470" y="40" width="270" height="56" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="605" y="64" font-family="monospace" font-size="13" fill="#333333" text-anchor="middle">import osciladores</text>
  <text x="605" y="84" font-family="sans-serif" font-size="11" fill="#666666" text-anchor="middle">ejecuta __init__.py, una sola vez</text>

  <path d="M 330 278 C 420 278, 470 140, 540 100" fill="none" stroke="#1f5fa8" stroke-width="1.5" marker-end="url(#flecha)"/>
  <path d="M 330 236 C 400 236, 450 130, 520 100" fill="none" stroke="#1f5fa8" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="470" y="280" font-family="sans-serif" font-size="11" fill="#1f5fa8">el notebook y las pruebas</text>
  <text x="470" y="294" font-family="sans-serif" font-size="11" fill="#1f5fa8">importan lo mismo</text>

  <path d="M 470 74 C 420 80, 380 112, 334 112" fill="none" stroke="#1f5fa8" stroke-width="1.5" marker-end="url(#flecha)"/>

  <path d="M 62 111 C 44 114, 44 134, 60 138" fill="none" stroke="#1f5fa8" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="600" y="150" font-family="sans-serif" font-size="11" fill="#666666">__init__.py trae lo de</text>
  <text x="600" y="166" font-family="sans-serif" font-size="11" fill="#666666">amortiguado.py; energia.py</text>
  <text x="600" y="182" font-family="sans-serif" font-size="11" fill="#666666">se importa aparte:</text>
  <text x="740" y="202" text-anchor="end" font-family="monospace" font-size="12" fill="#333333">from osciladores import energia</text>
</svg>
