<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Estructura de un proyecto: la carpeta proyecto-intermedio contiene README.md, requirements.txt, el modulo modelo.py y tres notebooks numerados; los tres notebooks importan modelo.py, donde viven las funciones y los parametros">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fa8"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="758" height="298" rx="12" fill="#f7f7f5" stroke="#d8d8d3" stroke-width="1"/>

  <!-- la carpeta del proyecto, como la ve el explorador de archivos -->
  <rect x="20" y="24" width="300" height="214" rx="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="36" y="50" font-family="monospace" font-size="14" font-weight="bold" fill="#333333">proyecto-intermedio/</text>
  <line x1="36" y1="60" x2="304" y2="60" stroke="#d8d8d3" stroke-width="1"/>

  <text x="48" y="84" font-family="monospace" font-size="13" fill="#333333">README.md</text>
  <text x="304" y="84" font-family="sans-serif" font-size="11" fill="#666666" text-anchor="end">que es y como correrlo</text>
  <text x="48" y="110" font-family="monospace" font-size="13" fill="#333333">requirements.txt</text>
  <text x="304" y="110" font-family="sans-serif" font-size="11" fill="#666666" text-anchor="end">versiones fijas</text>
  <text x="48" y="136" font-family="monospace" font-size="13" font-weight="bold" fill="#1f5fa8">modelo.py</text>
  <text x="304" y="136" font-family="sans-serif" font-size="11" fill="#666666" text-anchor="end">funciones y parametros</text>
  <text x="48" y="162" font-family="monospace" font-size="13" fill="#333333">01-planteamiento.ipynb</text>
  <text x="48" y="188" font-family="monospace" font-size="13" fill="#333333">02-solucion.ipynb</text>
  <text x="48" y="214" font-family="monospace" font-size="13" fill="#333333">03-graficas.ipynb</text>

  <!-- el modulo, unica fuente de verdad -->
  <rect x="372" y="120" width="130" height="58" rx="8" fill="#ffffff" stroke="#1f5fa8" stroke-width="2"/>
  <text x="437" y="145" font-family="monospace" font-size="13" fill="#1f5fa8" text-anchor="middle">modelo.py</text>
  <text x="437" y="164" font-family="sans-serif" font-size="11" fill="#666666" text-anchor="middle">se escribe una vez</text>

  <!-- los notebooks lo importan -->
  <rect x="566" y="40" width="174" height="46" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="653" y="68" font-family="monospace" font-size="12" fill="#333333" text-anchor="middle">01-planteamiento</text>
  <rect x="566" y="126" width="174" height="46" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="653" y="154" font-family="monospace" font-size="12" fill="#333333" text-anchor="middle">02-solucion</text>
  <rect x="566" y="212" width="174" height="46" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="653" y="240" font-family="monospace" font-size="12" fill="#333333" text-anchor="middle">03-graficas</text>

  <line x1="504" y1="140" x2="562" y2="66" stroke="#1f5fa8" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="504" y1="149" x2="562" y2="149" stroke="#1f5fa8" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="504" y1="158" x2="562" y2="232" stroke="#1f5fa8" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="437" y="204" font-family="monospace" font-size="12" fill="#1f5fa8" text-anchor="middle">import modelo</text>

  <text x="380" y="278" font-family="sans-serif" font-size="12" fill="#666666" text-anchor="middle">cada notebook importa el modulo y corre solo, desde un kernel limpio &#8226; ninguno depende de lo que dejo otro en memoria</text>
</svg>
