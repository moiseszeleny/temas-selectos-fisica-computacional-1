<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Anatomia de un Pull Request en GitHub: pestanas Conversation, Commits, Checks y Files changed; en Files changed el boton + junto a una linea abre un comentario de linea, que puede llevar un bloque suggestion; al final, Review changes ofrece Comment, Approve y Request changes">
  <rect x="1" y="1" width="758" height="338" rx="12" fill="#f7f7f5" stroke="#d8d8d3" stroke-width="1"/>

  <!-- pestanas del PR -->
  <text x="24" y="34" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333333">Tarea 09  #4</text>
  <text x="24" y="66" font-family="sans-serif" font-size="12" fill="#666666">Conversation</text>
  <text x="124" y="66" font-family="sans-serif" font-size="12" fill="#666666">Commits</text>
  <text x="194" y="66" font-family="sans-serif" font-size="12" fill="#666666">Checks</text>
  <text x="256" y="66" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f5fa8">Files changed</text>
  <line x1="256" y1="74" x2="340" y2="74" stroke="#1f5fa8" stroke-width="3"/>
  <line x1="20" y1="76" x2="510" y2="76" stroke="#d8d8d3" stroke-width="1"/>

  <!-- el diff -->
  <rect x="20" y="106" width="490" height="128" rx="6" fill="#ffffff" stroke="#bbbbb5" stroke-width="1"/>
  <rect x="21" y="107" width="488" height="22" fill="#eeeeea"/>
  <text x="30" y="122" font-family="monospace" font-size="11" fill="#333333">semana-09/tarea/tarea-09.ipynb</text>
  <rect x="21" y="131" width="488" height="20" fill="#fbe9e7"/>
  <text x="44" y="145" font-family="monospace" font-size="12" fill="#c0392b">-    "fuerza = ...\n",</text>
  <rect x="21" y="153" width="488" height="20" fill="#e6f4ea"/>
  <text x="44" y="167" font-family="monospace" font-size="12" fill="#2e7d32">+    "f = -sp.diff(energia_potencial, x)\n",</text>
  <!-- el boton + aparece al pasar el cursor por la linea -->
  <rect x="25" y="155" width="16" height="16" rx="3" fill="#1f5fa8"/>
  <text x="33" y="168" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>

  <!-- comentario de linea con sugerencia -->
  <rect x="40" y="180" width="458" height="46" rx="6" fill="#ffffff" stroke="#1f5fa8" stroke-width="1.5"/>
  <text x="50" y="197" font-family="sans-serif" font-size="11" fill="#333333">f no dice que es; con el nombre que pide el enunciado se lee sola:</text>
  <text x="50" y="216" font-family="monospace" font-size="11" fill="#1f5fa8">```suggestion   fuerza = -sp.diff(energia_potencial, x)</text>

  <text x="265" y="256" font-family="sans-serif" font-size="12" fill="#1f5fa8" text-anchor="middle">el + junto a la linea abre un comentario de linea</text>
  <text x="265" y="274" font-family="sans-serif" font-size="11" fill="#666666" text-anchor="middle">Start a review junta varios comentarios y los envia todos al final</text>

  <!-- el boton final -->
  <rect x="540" y="106" width="200" height="30" rx="6" fill="#2e7d32"/>
  <text x="640" y="126" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">Review changes</text>
  <rect x="540" y="142" width="200" height="132" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <circle cx="556" cy="166" r="5" fill="none" stroke="#333333" stroke-width="1.5"/>
  <circle cx="556" cy="166" r="2.5" fill="#333333"/>
  <text x="570" y="170" font-family="sans-serif" font-size="12" fill="#333333">Comment</text>
  <text x="570" y="186" font-family="sans-serif" font-size="11" fill="#666666">opinar sin decidir</text>
  <circle cx="556" cy="208" r="5" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="570" y="212" font-family="sans-serif" font-size="12" fill="#333333">Approve</text>
  <text x="570" y="228" font-family="sans-serif" font-size="11" fill="#666666">listo para fusionar</text>
  <circle cx="556" cy="248" r="5" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="570" y="252" font-family="sans-serif" font-size="12" fill="#333333">Request changes</text>
  <text x="570" y="268" font-family="sans-serif" font-size="11" fill="#666666">hay que corregir antes</text>

  <text x="380" y="316" font-family="sans-serif" font-size="12" fill="#666666" text-anchor="middle">GitHub esta en ingles &#8226; quien revisa comenta lineas concretas &#8226; quien es autor responde con commits en la misma rama</text>
</svg>
