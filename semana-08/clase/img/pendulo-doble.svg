<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 310" width="320" height="310" role="img" aria-label="Pendulo doble: varilla L1 cuelga del pivote O con angulo theta1 y de su extremo P1 cuelga la varilla L2 con angulo theta2; ambos angulos se miden respecto a la vertical">
  <defs>
    <marker id="flecha-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="flecha-azul" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="flecha-rojo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="flecha-verde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e8b57"/>
    </marker>
    <marker id="flecha-tenue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="318" height="308" rx="12" fill="#f7f7f5" stroke="#d8d8d3" stroke-width="1"/>

  <!-- techo y verticales -->
  <line x1="80" y1="40" x2="160" y2="40" stroke="#333333" stroke-width="2"/>
  <path d="M 88 40 L 80 32 M 98 40 L 90 32 M 108 40 L 100 32 M 118 40 L 110 32 M 128 40 L 120 32 M 138 40 L 130 32 M 148 40 L 140 32 M 158 40 L 150 32" stroke="#333333" stroke-width="1"/>
  <line x1="120.0" y1="40.0" x2="120.0" y2="170.0" stroke="#333333" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="170.7" y1="148.8" x2="170.7" y2="273.8" stroke="#333333" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- varillas -->
  <line x1="120.0" y1="40.0" x2="170.7" y2="148.8" stroke="#8a8a85" stroke-width="5" stroke-linecap="round"/>
  <line x1="170.7" y1="148.8" x2="258.8" y2="222.7" stroke="#8a8a85" stroke-width="5" stroke-linecap="round"/>

  <!-- angulos, cada uno desde la vertical -->
  <path d="M 120.0 100.0 A 60 60 0 0 0 145.4 94.4" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="132.0" y="118.2" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#c0392b" font-style="italic">θ</text>
  <text x="141.0" y="122.2" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="12" fill="#c0392b" font-style="italic">1</text>
  <path d="M 170.7 203.8 A 55 55 0 0 0 212.8 184.1" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="196.3" y="218.2" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#c0392b" font-style="italic">θ</text>
  <text x="205.3" y="222.2" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="12" fill="#c0392b" font-style="italic">2</text>

  <!-- longitudes -->
  <text x="152.1" y="76.5" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#333333" font-style="italic">L</text>
  <text x="162.1" y="80.5" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="12" fill="#333333" font-style="italic">1</text>
  <text x="202.7" y="163.1" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#333333" font-style="italic">L</text>
  <text x="212.7" y="167.1" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="12" fill="#333333" font-style="italic">2</text>

  <!-- unitarios a_1y y a_2y (posiciones: -L1 a_1y y -L2 a_2y) -->
  <line x1="183.4" y1="142.8" x2="164.4" y2="102.1" stroke="#1f5fa8" stroke-width="2" marker-end="url(#flecha-azul)"/>
  <text x="170.4" y="106.1" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#1f5fa8" font-weight="bold">a</text>
  <text x="180.4" y="110.1" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="12" fill="#1f5fa8" font-style="italic">1y</text>
  <path d="M 171.9 95.1 L 175.1 92.1 L 178.3 95.1" fill="none" stroke="#1f5fa8" stroke-width="1.3"/>
  <line x1="267.8" y1="212.0" x2="233.3" y2="183.0" stroke="#1f5fa8" stroke-width="2" marker-end="url(#flecha-azul)"/>
  <text x="239.3" y="187.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#1f5fa8" font-weight="bold">a</text>
  <text x="249.4" y="191.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="12" fill="#1f5fa8" font-style="italic">2y</text>
  <path d="M 240.9 176.0 L 244.1 173.0 L 247.3 176.0" fill="none" stroke="#1f5fa8" stroke-width="1.3"/>

  <!-- puntos -->
  <circle cx="120" cy="40" r="4" fill="#333333"/>
  <text x="96.0" y="60.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#333333" font-style="italic">O</text>
  <circle cx="170.7" cy="148.8" r="7" fill="#333333"/>
  <text x="140.7" y="158.8" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#333333" font-style="italic">P</text>
  <text x="151.7" y="162.8" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="11" fill="#333333" font-style="italic">1</text>
  <circle cx="258.8" cy="222.7" r="7" fill="#333333"/>
  <text x="246.8" y="248.7" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#333333" font-style="italic">P</text>
  <text x="257.8" y="252.7" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="11" fill="#333333" font-style="italic">2</text>
</svg>
