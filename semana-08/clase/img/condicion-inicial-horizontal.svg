<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" width="520" height="270" role="img" aria-label="Condicion inicial con las dos varillas horizontales y en reposo: ambas masas tienen aceleracion g hacia abajo (caida libre); un instante despues la primera varilla gira y la segunda baja paralela a si misma">
  <defs>
    <marker id="flecha-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="flecha-azul" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="flecha-rojo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="flecha-verde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e8b57"/>
    </marker>
    <marker id="flecha-tenue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="518" height="268" rx="12" fill="#f7f7f5" stroke="#d8d8d3" stroke-width="1"/>
  <!-- techo y pivote -->
  <line x1="30.0" y1="75.0" x2="110.0" y2="75.0" stroke="#333333" stroke-width="2"/>
  <path d="M 38.0 75.0 L 30.0 67.0 M 48.0 75.0 L 40.0 67.0 M 58.0 75.0 L 50.0 67.0 M 68.0 75.0 L 60.0 67.0 M 78.0 75.0 L 70.0 67.0 M 88.0 75.0 L 80.0 67.0 M 98.0 75.0 L 90.0 67.0 M 108.0 75.0 L 100.0 67.0" stroke="#333333" stroke-width="1"/>
  <circle cx="70.0" cy="75.0" r="5" fill="#f7f7f5" stroke="#333333" stroke-width="1.5"/>
  <circle cx="70.0" cy="75.0" r="1.6" fill="#333333"/>
  <line x1="70.0" y1="75.0" x2="70.0" y2="195.0" stroke="#333333" stroke-width="1" stroke-dasharray="5 4"/>
  <path d="M 70.0 109.0 A 34 34 0 0 0 104.0 75.0" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="100.0" y="121.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#c0392b"><tspan font-style="italic">θ</tspan><tspan font-style="italic" dy="4" font-size="10">1</tspan><tspan dy="-4"> = </tspan><tspan font-style="italic">π</tspan><tspan>/2</tspan></text>

  <!-- un instante despues: la varilla 1 gira y la 2 baja sin girar -->
  <line x1="70.0" y1="75.0" x2="236.3" y2="110.3" stroke="#333333" stroke-width="3" stroke-dasharray="6 4" stroke-opacity="0.3"/>
  <circle cx="236.3" cy="110.3" r="10" fill="#8a8a85" stroke="#333333" stroke-width="1.5" opacity="0.3"/>
  <line x1="236.3" y1="110.3" x2="406.3" y2="110.3" stroke="#333333" stroke-width="3" stroke-dasharray="6 4" stroke-opacity="0.3"/>
  <circle cx="406.3" cy="110.3" r="10" fill="#8a8a85" stroke="#333333" stroke-width="1.5" opacity="0.3"/>

  <!-- varillas horizontales en reposo -->
  <line x1="70.0" y1="75.0" x2="240.0" y2="75.0" stroke="#333333" stroke-width="3"/>
  <circle cx="240.0" cy="75.0" r="10" fill="#8a8a85" stroke="#333333" stroke-width="1.5"/>
  <line x1="240.0" y1="75.0" x2="410.0" y2="75.0" stroke="#333333" stroke-width="3"/>
  <circle cx="410.0" cy="75.0" r="10" fill="#8a8a85" stroke="#333333" stroke-width="1.5"/>
  <text x="234.0" y="59.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#333333"><tspan font-style="italic">P</tspan><tspan font-style="italic" dy="4" font-size="12">1</tspan></text>
  <text x="404.0" y="59.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#333333"><tspan font-style="italic">P</tspan><tspan font-style="italic" dy="4" font-size="12">2</tspan></text>

  <!-- peso (rojo) y aceleracion (verde) de cada masa -->
  <line x1="230.0" y1="87.0" x2="230.0" y2="155.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#flecha-rojo)"/>
  <line x1="250.0" y1="87.0" x2="250.0" y2="155.0" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#flecha-verde)"/>
  <text x="218.0" y="145.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#c0392b" text-anchor="end"><tspan font-style="italic">m</tspan><tspan font-style="italic" dy="4" font-size="11">1</tspan><tspan font-weight="bold" dy="-4">g</tspan></text>
  <line x1="400.0" y1="87.0" x2="400.0" y2="155.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#flecha-rojo)"/>
  <line x1="420.0" y1="87.0" x2="420.0" y2="155.0" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#flecha-verde)"/>
  <text x="388.0" y="145.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#c0392b" text-anchor="end"><tspan font-style="italic">m</tspan><tspan font-style="italic" dy="4" font-size="11">2</tspan><tspan font-weight="bold" dy="-4">g</tspan></text>
  <text x="434.0" y="145.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#2e8b57"><tspan font-weight="bold">a</tspan><tspan> = </tspan><tspan font-weight="bold">g</tspan></text>
  <text x="260.0" y="215.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#333333" text-anchor="middle"><tspan font-style="italic">θ</tspan><tspan dx="-7.2" dy="-4">¨</tspan><tspan font-style="italic" dx="1.0" dy="8" font-size="11">1</tspan><tspan dy="-4"> = −</tspan><tspan font-style="italic">g</tspan><tspan>/</tspan><tspan font-style="italic">L</tspan><tspan font-style="italic" dy="4" font-size="11">1</tspan><tspan dy="-4">  (caída libre),     </tspan><tspan font-style="italic">θ</tspan><tspan dx="-7.2" dy="-4">¨</tspan><tspan font-style="italic" dx="1.0" dy="8" font-size="11">2</tspan><tspan dy="-4"> = 0</tspan></text>
  <text x="260.0" y="243.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="14" fill="#333333" text-anchor="middle">la varilla 2 baja paralela a sí misma</text>
</svg>
