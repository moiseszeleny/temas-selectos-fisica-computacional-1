<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="Velocidades del pendulo doble: v2 es la suma de L1 theta1 punto a_1x y L2 theta2 punto a_2x; el angulo entre los dos sumandos es theta2 menos theta1, y la ley de cosenos da el termino con cos(theta1 - theta2)">
  <defs>
    <marker id="flecha-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="flecha-azul" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="flecha-rojo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="flecha-verde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e8b57"/>
    </marker>
    <marker id="flecha-tenue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="598" height="318" rx="12" fill="#f7f7f5" stroke="#d8d8d3" stroke-width="1"/>  <text x="150.0" y="290.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="14" fill="#333333" text-anchor="middle">en el péndulo</text>

  <!-- techo y pivote -->
  <line x1="50.0" y1="50.0" x2="130.0" y2="50.0" stroke="#333333" stroke-width="2"/>
  <path d="M 58.0 50.0 L 50.0 42.0 M 68.0 50.0 L 60.0 42.0 M 78.0 50.0 L 70.0 42.0 M 88.0 50.0 L 80.0 42.0 M 98.0 50.0 L 90.0 42.0 M 108.0 50.0 L 100.0 42.0 M 118.0 50.0 L 110.0 42.0 M 128.0 50.0 L 120.0 42.0" stroke="#333333" stroke-width="1"/>
  <circle cx="90.0" cy="50.0" r="5" fill="#f7f7f5" stroke="#333333" stroke-width="1.5"/>
  <circle cx="90.0" cy="50.0" r="1.6" fill="#333333"/>
  <line x1="90.0" y1="50.0" x2="90.0" y2="250.0" stroke="#333333" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- varillas -->
  <line x1="90.0" y1="50.0" x2="142.8" y2="141.5" stroke="#333333" stroke-width="3"/>
  <circle cx="142.8" cy="141.5" r="10" fill="#8a8a85" stroke="#333333" stroke-width="1.5"/>
  <line x1="142.8" y1="141.5" x2="221.1" y2="178.0" stroke="#333333" stroke-width="3"/>
  <circle cx="221.1" cy="178.0" r="10" fill="#8a8a85" stroke="#333333" stroke-width="1.5"/>
  <line x1="142.8" y1="141.5" x2="142.8" y2="211.5" stroke="#333333" stroke-width="1" stroke-dasharray="5 4"/>
  <path d="M 90.0 84.0 A 34 34 0 0 0 107.0 79.4" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="88.0" y="100.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#c0392b"><tspan font-style="italic">θ</tspan><tspan font-style="italic" dy="4" font-size="12">1</tspan></text>
  <path d="M 142.8 169.5 A 28 28 0 0 0 168.2 153.3" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="150.8" y="185.5" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#c0392b"><tspan font-style="italic">θ</tspan><tspan font-style="italic" dy="4" font-size="12">2</tspan></text>
  <text x="112.8" y="145.5" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#333333"><tspan font-style="italic">P</tspan><tspan font-style="italic" dy="4" font-size="12">1</tspan></text>
  <text x="223.1" y="208.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#333333"><tspan font-style="italic">P</tspan><tspan font-style="italic" dy="4" font-size="12">2</tspan></text>

  <!-- v1 en P1; en P2, v1 mas el giro de la segunda varilla -->
  <line x1="142.8" y1="141.5" x2="190.4" y2="114.0" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#flecha-azul)"/>
  <text x="194.4" y="112.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#1f5fa8"><tspan font-weight="bold">v</tspan><tspan font-style="italic" dy="4" font-size="12">1</tspan></text>
  <line x1="221.1" y1="178.0" x2="268.7" y2="150.5" stroke="#1f5fa8" stroke-width="1.5" marker-end="url(#flecha-azul)" stroke-opacity="0.45"/>
  <line x1="268.7" y1="150.5" x2="286.5" y2="112.4" stroke="#1f5fa8" stroke-width="1.5" marker-end="url(#flecha-azul)" stroke-opacity="0.45"/>
  <line x1="221.1" y1="178.0" x2="286.5" y2="112.4" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#flecha-azul)"/>
  <text x="290.5" y="112.4" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#1f5fa8"><tspan font-weight="bold">v</tspan><tspan font-style="italic" dy="4" font-size="12">2</tspan></text>

  <!-- separador -->
  <line x1="300.0" y1="20.0" x2="300.0" y2="300.0" stroke="#d8d8d3" stroke-width="1"/>
  <text x="450.0" y="290.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="14" fill="#333333" text-anchor="middle">la suma de vectores</text>

  <!-- triangulo: v2 = L1 theta1' a_1x + L2 theta2' a_2x -->
  <line x1="350.0" y1="240.0" x2="453.9" y2="180.0" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#flecha-azul)"/>
  <line x1="453.9" y1="180.0" x2="496.2" y2="89.4" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#flecha-azul)"/>
  <line x1="350.0" y1="240.0" x2="496.2" y2="89.4" stroke="#1f5fa8" stroke-width="3" marker-end="url(#flecha-azul)"/>
  <line x1="453.9" y1="180.0" x2="501.6" y2="152.5" stroke="#999999" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M 479.9 165.0 A 30 30 0 0 0 466.6 152.8" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="475.9" y="204.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#c0392b"><tspan font-style="italic">θ</tspan><tspan font-style="italic" dy="4" font-size="10">2</tspan><tspan dy="-4"> − </tspan><tspan font-style="italic">θ</tspan><tspan font-style="italic" dy="4" font-size="10">1</tspan></text>
  <text x="410.0" y="236.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#1f5fa8"><tspan font-style="italic">L</tspan><tspan font-style="italic" dy="4" font-size="11">1</tspan><tspan font-style="italic" dy="-4">θ</tspan><tspan dx="-7.2" dy="-4">˙</tspan><tspan font-style="italic" dx="1.0" dy="8" font-size="11">1</tspan><tspan dy="-4"> </tspan><tspan font-weight="bold">â</tspan><tspan font-style="italic" dy="4" font-size="11">1x</tspan></text>
  <text x="489.1" y="130.7" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#1f5fa8"><tspan font-style="italic">L</tspan><tspan font-style="italic" dy="4" font-size="11">2</tspan><tspan font-style="italic" dy="-4">θ</tspan><tspan dx="-7.2" dy="-4">˙</tspan><tspan font-style="italic" dx="1.0" dy="8" font-size="11">2</tspan><tspan dy="-4"> </tspan><tspan font-weight="bold">â</tspan><tspan font-style="italic" dy="4" font-size="11">2x</tspan></text>
  <text x="393.1" y="158.7" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#1f5fa8"><tspan font-weight="bold">v</tspan><tspan font-style="italic" dy="4" font-size="12">2</tspan></text>
</svg>
